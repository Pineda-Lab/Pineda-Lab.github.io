en:
  privacy:
    title: "Privacy Notice"
    paragraphs:
      - "In compliance with Mexico's Federal Law on the Protection of Personal Data Held by Private Parties (LFPDPPP) and its Regulations, Pineda Lab, domiciled at the National School of Higher Studies, Morelia Campus, Universidad Nacional Autónoma de México (ENES Morelia, UNAM), and hereinafter referred to as the \"Data Controller,\" issues this Privacy Notice to any person who, by voluntarily sharing personal data with the Data Controller, shall hereinafter be referred to as the \"Data Subject,\" so that the Data Subject may know, prior to any such disclosure, the purposes for which their personal data will be treated and the means by which they may exercise the rights afforded to them by law, all of which is set forth in the following clauses:"
      - "FIRST. Personal Data Collected. The Data Controller does not collect personal data automatically through forms, tracking cookies, or profiling tools, and the only personal data it treats is that which the Data Subject voluntarily provides by email, such as their name, email address, and, where applicable, academic background."
      - "SECOND. Purposes of Processing. The personal data collected is used exclusively to respond to academic or collaboration inquiries, to process admission or affiliation requests submitted to Pineda Lab, and to reply to any communication initiated by the Data Subject, and the Data Controller shall not use such data for any purpose other than those stated in this clause without the Data Subject's prior consent."
      - "THIRD. Retention Period. Personal data is retained only for as long as strictly necessary to fulfill the purposes described in the preceding clause, following which it is securely deleted, unless a legal obligation requires that it be retained for a longer period."
      - "FOURTH. Data Transfers and Cookies. This website embeds an interactive Google Maps view on its Home page, a service provided by Google LLC, which may set functional cookies and transfer certain data to servers located outside Mexico in accordance with that provider's own privacy policy, and, other than through this embedded service, the Data Controller does not employ advertising, profiling, or analytics tools, nor does it transfer personal data to any other third party."
      - "FIFTH. Security Measures. The Data Controller has implemented administrative and technical safeguards reasonable and appropriate to the nature of the data it processes, for the purpose of protecting such data against damage, loss, alteration, destruction, or unauthorized use, access, or processing."
      - "SIXTH. Minors. Given that this website is directed at an academic and professional audience, the Data Controller does not knowingly or intentionally collect personal data from minors."
      - "SEVENTH. ARCO Rights and Revocation of Consent. The Data Subject shall at all times have the right to Access their personal data, to Rectify it where inaccurate, to request its Cancellation where it is no longer necessary for the purposes described herein, to Object to its processing for specific purposes, and to revoke, at any time, any consent previously granted, which rights the Data Subject may exercise by submitting a written request to arturolp@enesmorelia.unam.mx stating their full name, a clear description of the request, and proof of identity, to which the Data Controller shall respond within the timeframes established by applicable law."
      - "EIGHTH. Amendments to this Notice. The Data Controller reserves the right to modify or update this Privacy Notice at any time in order to reflect legislative developments, changes to its internal policies, or new requirements, and any such amendment shall be published on this page together with the date of its last update, it being the Data Subject's responsibility to periodically review this Notice."
      - "Last updated: August 11, 2026."
      - "Pineda Lab"
  terms:
    title: "Terms and Conditions of Use"
    paragraphs:
      - "These Terms and Conditions of Use, hereinafter the \"Terms,\" are entered into, on the one hand, by Pineda Lab, part of the National School of Higher Studies, Morelia Campus, Universidad Nacional Autónoma de México (ENES Morelia, UNAM), which operates the website to which these Terms apply and shall hereinafter be referred to as \"Pineda Lab,\" and, on the other hand, by any person who accesses or uses said website, hereinafter the \"Site,\" who shall hereinafter be referred to as the \"User,\" it being understood that access to or use of the Site by the User constitutes full and unreserved acceptance of the following clauses:"
      - "FIRST. Nature of the Content. The content published on the Site is exclusively academic, scientific, and informational in nature, relating to Pineda Lab's activities, and shall not be construed by the User as professional, medical, or any other form of advice."
      - "SECOND. Intellectual Property. Unless expressly stated otherwise, all text, media, and instructional design published on the Site are the intellectual property of Pineda Lab, ENES Morelia, UNAM, and are protected under applicable Mexican and international copyright law, it being understood that the code repositories and research pipelines hosted on Pineda Lab's GitHub organization are governed independently by their respective open-source licenses."
      - "THIRD. Permitted Use. The User is authorized to view, download, and share content from the Site solely for non-commercial, academic, or informational purposes, provided that appropriate credit is given to Pineda Lab, and the User shall refrain from reproducing, distributing, or commercially exploiting such content without Pineda Lab's prior written authorization."
      - "FOURTH. Disclaimer of Warranties. The content of the Site is provided \"as is\" and \"as available,\" without warranty of any kind, express or implied, as to its accuracy, timeliness, completeness, or fitness for a particular purpose, and the User assumes the risks inherent to its use."
      - "FIFTH. Limitation of Liability. Neither Pineda Lab nor ENES Morelia, UNAM shall be liable to the User for any direct or indirect damages arising from access to, use of, or inability to use the Site or its content."
      - "SIXTH. Third-Party Links. Where the Site contains links to academic or institutional portals operated by third parties, Pineda Lab neither controls nor assumes any responsibility for the content, privacy practices, or availability of such external sites."
      - "SEVENTH. Governing Law and Jurisdiction. These Terms shall be governed by and construed in accordance with the federal laws of the United Mexican States, and for the resolution of any dispute arising from their interpretation or performance, the User and Pineda Lab submit to the jurisdiction of the competent courts of the city of Morelia, Michoacán, expressly waiving any other jurisdiction that may correspond to them by reason of their present or future domicile."
      - "EIGHTH. Amendments. Pineda Lab may modify these Terms at any time, and the User's continued use of the Site following the publication of any such amendment shall constitute their acceptance of the Terms as modified."
      - "Last updated: August 11, 2026."
      - "Pineda Lab"

es:
  privacy:
    title: "Aviso de Privacidad"
    paragraphs:
      - "En cumplimiento de lo dispuesto por la Ley Federal de Protección de Datos Personales en Posesión de los Particulares (LFPDPPP) y su Reglamento, el Pineda Lab, con domicilio en la Escuela Nacional de Estudios Superiores Unidad Morelia, Universidad Nacional Autónoma de México (ENES Morelia, UNAM), y a quien en lo sucesivo se denominará el \"Responsable\", pone el presente Aviso de Privacidad a disposición de toda persona que, al compartir voluntariamente sus datos personales con el Responsable, en lo sucesivo será denominada el \"Titular\", a efecto de que este último conozca, previo a dicha entrega, las finalidades para las que serán tratados sus datos personales y los medios a través de los cuales podrá ejercer los derechos que la ley le confiere, todo lo cual se sujeta a las siguientes cláusulas:"
      - "PRIMERA. Datos Personales Recabados.- El Responsable no recaba datos personales de manera automatizada a través de formularios, cookies de rastreo o herramientas de perfilamiento, siendo los únicos datos personales que trata aquellos que el Titular proporcione de manera voluntaria por correo electrónico, tales como su nombre, dirección de correo electrónico y, en su caso, antecedentes académicos."
      - "SEGUNDA. Finalidades del Tratamiento.- Los datos personales recabados serán utilizados exclusivamente para atender consultas académicas o de colaboración, procesar solicitudes de admisión o vinculación con el Pineda Lab, y dar respuesta a cualquier comunicación iniciada por el Titular, sin que el Responsable pueda utilizarlos para una finalidad distinta a las aquí señaladas sin el consentimiento previo del Titular."
      - "TERCERA. Plazo de Conservación.- Los datos personales serán conservados únicamente durante el tiempo estrictamente necesario para cumplir con las finalidades señaladas en la cláusula que antecede, transcurrido el cual serán suprimidos de forma segura, salvo que exista una obligación legal que exija su conservación por un plazo mayor."
      - "CUARTA. Transferencia de Datos y Uso de Cookies.- El sitio incorpora una vista interactiva de Google Maps en su página de inicio, servicio proporcionado por Google LLC, el cual puede instalar cookies de carácter técnico y transferir determinada información a servidores ubicados fuera del territorio nacional conforme a la política de privacidad de dicho proveedor, sin que, fuera de este servicio, el Responsable emplee herramientas de publicidad, perfilamiento o analítica, ni transfiera datos personales a ningún otro tercero."
      - "QUINTA. Medidas de Seguridad.- El Responsable ha implementado medidas de seguridad administrativas y técnicas razonables y acordes con la naturaleza de los datos que trata, con el objeto de protegerlos contra daño, pérdida, alteración, destrucción, así como contra su uso, acceso o tratamiento no autorizado."
      - "SEXTA. Menores de Edad.- En virtud de que el sitio está dirigido a un público académico y profesional, el Responsable no recaba de manera consciente ni deliberada datos personales de menores de edad."
      - "SÉPTIMA. Derechos ARCO y Revocación del Consentimiento.- El Titular tendrá en todo momento el derecho de Acceder a sus datos personales, Rectificarlos en caso de ser inexactos, Cancelar su tratamiento cuando considere que no son necesarios para las finalidades aquí señaladas, Oponerse a su tratamiento para fines específicos, y revocar en cualquier momento el consentimiento que hubiere otorgado, derechos que podrá ejercer mediante solicitud por escrito dirigida a arturolp@enesmorelia.unam.mx, en la que señale su nombre completo, una descripción clara de su solicitud y acompañe un medio que acredite su identidad, a la cual el Responsable dará respuesta dentro de los plazos previstos por la legislación aplicable."
      - "OCTAVA. Modificaciones al Presente Aviso.- El Responsable se reserva el derecho de modificar o actualizar el presente Aviso de Privacidad en cualquier momento, con el objeto de atender novedades legislativas, cambios en sus políticas internas o nuevos requerimientos, modificación que será publicada en esta misma página junto con la fecha de su última actualización, siendo responsabilidad del Titular consultarla periódicamente."
      - "Última actualización: 11 de agosto de 2026."
      - "Pineda Lab"
  terms:
    title: "Términos y Condiciones de Uso"
    paragraphs:
      - "Los presentes Términos y Condiciones de Uso, en lo sucesivo los \"Términos\", se celebran por una parte por el Pineda Lab, adscrito a la Escuela Nacional de Estudios Superiores Unidad Morelia, Universidad Nacional Autónoma de México (ENES Morelia, UNAM), quien opera el sitio web al que los presentes Términos resultan aplicables y en lo sucesivo será denominado el \"Pineda Lab\", y por otra parte por cualquier persona que acceda a dicho sitio web, en lo sucesivo el \"Sitio\", quien en lo sucesivo será denominada el \"Usuario\", entendiéndose que el acceso o uso del Sitio por parte del Usuario implica la aceptación plena y sin reserva de las siguientes cláusulas:"
      - "PRIMERA. Naturaleza del Contenido.- El contenido publicado en el Sitio tiene carácter exclusivamente académico, científico e informativo, relacionado con las actividades del Pineda Lab, por lo que el Usuario no deberá interpretarlo como asesoría profesional, médica o de cualquier otra índole."
      - "SEGUNDA. Propiedad Intelectual.- Salvo que se indique expresamente lo contrario, la totalidad de los textos, materiales audiovisuales y el diseño instruccional publicados en el Sitio son propiedad intelectual del Pineda Lab, ENES Morelia, UNAM, y se encuentran protegidos por la legislación mexicana e internacional en materia de derechos de autor, entendiéndose que los repositorios de código y pipelines de investigación alojados en la organización de GitHub del Pineda Lab se rigen de manera independiente por sus respectivas licencias de código abierto."
      - "TERCERA. Uso Permitido.- Se autoriza al Usuario a consultar, descargar y compartir el contenido del Sitio exclusivamente con fines no comerciales, académicos o informativos, siempre que otorgue el crédito correspondiente al Pineda Lab, absteniéndose de reproducir, distribuir o explotar comercialmente dicho contenido sin la autorización previa y por escrito del Pineda Lab."
      - "CUARTA. Exclusión de Garantías.- El contenido del Sitio se proporciona \"tal cual\" y \"según disponibilidad\", sin garantía alguna, expresa o implícita, respecto de su exactitud, vigencia, integridad o idoneidad para un fin en particular, asumiendo el Usuario los riesgos inherentes a su uso."
      - "QUINTA. Limitación de Responsabilidad.- Ni el Pineda Lab ni la ENES Morelia, UNAM serán responsables frente al Usuario por daño o perjuicio alguno, directo o indirecto, derivado del acceso, uso o imposibilidad de uso del Sitio o de su contenido."
      - "SEXTA. Enlaces a Terceros.- En caso de que el Sitio contenga enlaces a portales académicos o institucionales operados por terceros, el Pineda Lab no controla ni asume responsabilidad alguna por el contenido, las políticas de privacidad o la disponibilidad de dichos sitios externos."
      - "SÉPTIMA. Legislación Aplicable y Jurisdicción.- Los presentes Términos se regirán e interpretarán conforme a las leyes federales de los Estados Unidos Mexicanos, y para la resolución de cualquier controversia derivada de su interpretación o cumplimiento, el Usuario y el Pineda Lab se someten a la jurisdicción de los tribunales competentes de la ciudad de Morelia, Michoacán, renunciando expresamente a cualquier otro fuero que pudiera corresponderles por razón de su domicilio presente o futuro."
      - "OCTAVA. Modificaciones.- El Pineda Lab podrá modificar los presentes Términos en cualquier momento, y el uso continuado del Sitio por parte del Usuario con posterioridad a la publicación de cualquier modificación constituirá la aceptación de los Términos así modificados."
      - "Última actualización: 11 de agosto de 2026."
      - "Pineda Lab"
