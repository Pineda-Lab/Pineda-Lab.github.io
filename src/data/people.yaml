  joinEyebrow: "Prospective students"
  joinTitle: "Join the Lab"
  joinDescription: "The Pineda Lab is looking for motivated students to develop their undergraduate or graduate thesis in AI in Health, digital health, or clinical genomics."
  joinEnesTitle: "Students at ENES Morelia, UNAM"
  joinEnesDescription: "Dr. López Pineda is affiliated with ENES Morelia and can formally advise thesis projects for students enrolled in its undergraduate programs. If you're interested, reach out to discuss potential topics."
  joinOtherTitle: "Students at other institutions"
