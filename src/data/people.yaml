  title: "People"
  description: "Meet the Pineda Lab's team members."
  piEyebrow: "Principal Investigator"
  piName: "Dr. Arturo López Pineda"
  piAffiliation: "Adjunct Professor, ENES Morelia, UNAM"
  piBio: "Dr. Arturo López Pineda leads the Pineda Lab at ENES Morelia, UNAM, where his research sits at the intersection of artificial intelligence and health. His work focuses on developing computational methods for clinical genomics, digital health tools, and AI systems that support better diagnosis, treatment, and health equity."
  piCeoNote: "He is also CEO of Amphora Health, a health-tech company building AI-driven clinical and genomic data platforms."
  educationHeading: "Education"
  education:
    - "Postdoctoral fellowship in Biomedical Data Science and Genetics, Stanford University"
    - "PhD and MS in Biomedical Informatics, University of Pittsburgh"
    - "MS in Artificial Intelligence, Tecnológico de Monterrey"
    - "BS in Computer Science, Tecnológico de Monterrey"
  linkedinLabel: "LinkedIn"
  amphoraLabel: "Amphora Health"
  orcidLabel: "ORCID"
  scholarLabel: "Google Scholar"

es:
  eyebrow: "Quiénes somos"
  title: "Personas"
  description: "Conoce al equipo del Pineda Lab."
  piEyebrow: "Investigador Principal"
  piName: "Dr. Arturo López Pineda"
  piAffiliation: "Profesor Adjunto, ENES Morelia, UNAM"
  piBio: "El Dr. Arturo López Pineda dirige el Pineda Lab en la ENES Morelia, UNAM, donde su investigación se ubica en la intersección entre la inteligencia artificial y la salud. Su trabajo se centra en desarrollar métodos computacionales para genómica clínica, herramientas de salud digital y sistemas de IA que apoyen un mejor diagnóstico, tratamiento y equidad en salud."
  piCeoNote: "También es director general (CEO) de Amphora Health, una empresa de tecnología en salud que desarrolla plataformas de datos clínicos y genómicos impulsadas por IA."
  educationHeading: "Formación Académica"
  education:
    - "Estancia posdoctoral en Ciencia de Datos Biomédicos y Genética, Universidad de Stanford"
    - "Doctorado y Maestría en Informática Biomédica, Universidad de Pittsburgh"
    - "Maestría en Inteligencia Artificial, Tecnológico de Monterrey"
    - "Licenciatura en Ciencias de la Computación, Tecnológico de Monterrey"
  linkedinLabel: "LinkedIn"
  amphoraLabel: "Amphora Health"
  orcidLabel: "ORCID"
  scholarLabel: "Google Scholar"
