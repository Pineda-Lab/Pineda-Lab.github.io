en:
  eyebrow: "Who we are"
  title: "People"
  description: "Meet the Pineda Lab's team members."
  piEyebrow: "Principal Investigator"
  piName: "Dr. Arturo López Pineda"
  piAffiliation: "Adjunct Professor, ENES Morelia, UNAM"
  piBio: "Dr. Arturo López Pineda leads the Pineda Lab at ENES Morelia, UNAM, where his research sits at the intersection of artificial intelligence and health. His work focuses on developing computational methods for clinical genomics, digital health tools, and AI systems that support better diagnosis, treatment, and health equity."
  piCeoNote: "He is also CEO of Amphora Health, a health-tech company building AI-driven clinical and genomic data platforms."
  educationHeading: "Education"
  education:
    - "Postdoctoral fellowship in Biomedical Data Science and Genetics, Stanford University"
    - "PhD and MS in Biomedical Informatics, University of Pittsburgh"
    - "MS in Artificial Intelligence, Tecnológico de Monterrey"
    - "BS in Computer Science, Tecnológico de Monterrey"
  linkedinLabel: "LinkedIn"
  amphoraLabel: "Amphora Health"
  orcidLabel: "ORCID"
  scholarLabel: "Google Scholar"
  contactLinksLabel: "Contact"
  socialLinksLabel: "Social Media"
  workLinksLabel: "Work"
  joinEyebrow: "Prospective students"
  joinTitle: "Join the Lab"
  joinDescription: "The Pineda Lab is looking for motivated students to develop their undergraduate or graduate thesis in AI in Health, digital health, or clinical genomics."
  joinEnesTitle: "Students at ENES Morelia, UNAM"
  joinEnesDescription: "Dr. López Pineda is affiliated with ENES Morelia and can formally advise thesis projects for students enrolled in its undergraduate programs. If you're interested, reach out to discuss potential topics."
  joinOtherTitle: "Students at other institutions"
  joinOtherDescription: "Not enrolled at ENES Morelia? We're still glad to hear from you: reach out and we can discuss whether a co-advised thesis with your home institution is possible."
  joinContactLabel: "Get in touch about a thesis"
  alumniEyebrow: "Our alumni"
  alumniTitle: "Alumni"
  alumniDescription: "Students who completed their thesis under the lab's guidance."
  alumni:
    - name: "Dr. Felipe Rodríguez Morán"
      degree: "M.D. (Médico Cirujano y Partero)"
      institution: 'Facultad de Ciencias Médicas y Biológicas "Dr. Ignacio Chávez", Universidad Michoacana de San Nicolás de Hidalgo'
      role: "Co-advised his undergraduate thesis in Medicine"

es:
  eyebrow: "Quiénes somos"
  title: "Personas"
  description: "Conoce al equipo del Pineda Lab."
  piEyebrow: "Investigador Principal"
  piName: "Dr. Arturo López Pineda"
  piAffiliation: "Profesor Adjunto, ENES Morelia, UNAM"
  piBio: "El Dr. Arturo López Pineda dirige el Pineda Lab en la ENES Morelia, UNAM, donde su investigación se ubica en la intersección entre la inteligencia artificial y la salud. Su trabajo se centra en desarrollar métodos computacionales para genómica clínica, herramientas de salud digital y sistemas de IA que apoyen un mejor diagnóstico, tratamiento y equidad en salud."
  piCeoNote: "También es director general (CEO) de Amphora Health, una empresa de tecnología en salud que desarrolla plataformas de datos clínicos y genómicos impulsadas por IA."
  educationHeading: "Formación Académica"
  education:
    - "Estancia posdoctoral en Ciencia de Datos Biomédicos y Genética, Universidad de Stanford"
    - "Doctorado y Maestría en Informática Biomédica, Universidad de Pittsburgh"
    - "Maestría en Inteligencia Artificial, Tecnológico de Monterrey"
    - "Licenciatura en Ciencias de la Computación, Tecnológico de Monterrey"
  linkedinLabel: "LinkedIn"
  amphoraLabel: "Amphora Health"
  orcidLabel: "ORCID"
  scholarLabel: "Google Scholar"
  contactLinksLabel: "Contacto"
  socialLinksLabel: "Redes Sociales"
  workLinksLabel: "Trabajo"
  joinEyebrow: "Estudiantes potenciales"
  joinTitle: "Únete al Laboratorio"
  joinDescription: "El Pineda Lab busca estudiantes motivados para desarrollar su tesis de licenciatura o posgrado en Inteligencia Artificial en Salud, Salud Digital o Genómica Clínica."
  joinEnesTitle: "Estudiantes de la ENES Morelia, UNAM"
  joinEnesDescription: "El Dr. López Pineda tiene adscripción en la ENES Morelia y puede asesorar formalmente proyectos de tesis de estudiantes inscritos en sus licenciaturas. Si te interesa, contáctanos para platicar sobre posibles temas."
  joinOtherTitle: "Estudiantes de otras instituciones"
  joinOtherDescription: "¿No estás inscrito en la ENES Morelia? Con gusto te escuchamos: contáctanos y podemos platicar si es posible una coasesoría de tesis con tu institución de origen."
  joinContactLabel: "Contáctanos sobre tu tesis"
  alumniEyebrow: "Nuestros egresados"
  alumniTitle: "Alumni"
  alumniDescription: "Estudiantes que completaron su tesis bajo la guía del laboratorio."
  alumni:
