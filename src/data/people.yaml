en:
  eyebrow: "Who we are"
  title: "People"
  description: "Explore the Pineda Lab."
  piEyebrow: "Principal Investigator"
  piName: "Dr. Arturo López Pineda"
  piAffiliation: "Adjunct Professor, ENES Morelia, UNAM · National System of Researchers (SNI), Mexico"
  piBio: "Dr. López Pineda is an Adjunct Professor at ENES Morelia, UNAM, and a member of Mexico's National System of Researchers (SNI). He holds a PhD in Biomedical Informatics from the University of Pittsburgh and completed a postdoctoral fellowship in Biomedical Data Science and Genetics at Stanford University. A Fulbright alumnus, he serves on the Editorial Committee of the Michoacán Institute of Science, Technology and Innovation (ICTI). His research focuses on applications of artificial intelligence in health, including clinical genomics, digital health, and systems that support better diagnosis and treatment with equity and ethics. As an entrepreneur, Dr. López Pineda is CEO of Amphora Health, a Mexican health-tech company building a digital health ecosystem that includes an electronic health record and a digital clinical brain."
  educationHeading: "Education"
  education:
    - "Postdoctoral fellow in Biomedical Data Science and Genetics, Stanford University"
    - "PhD in Biomedical Informatics, University of Pittsburgh"
    - "MS in Biomedical Informatics, University of Pittsburgh"
    - "MS in Artificial Intelligence, Tecnológico de Monterrey"
    - "BS in Computer Science, Tecnológico de Monterrey"
