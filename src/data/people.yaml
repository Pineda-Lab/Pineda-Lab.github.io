es:
  eyebrow: "Quiénes somos"
  title: "Personas"
  description: "Conoce el Pineda Lab."
  piEyebrow: "Investigador Principal"
  piName: "Dr. Arturo López Pineda"
  piAffiliation: "Profesor de Asignatura, ENES Morelia, UNAM · Sistema Nacional de Investigadores (SNI)"
  piBio: "El Dr. López Pineda es Profesor de Asignatura en la ENES Morelia, UNAM, y miembro del Sistema Nacional de Investigadores (SNI). Cuenta con un doctorado en Informática Biomédica por la Universidad de Pittsburgh y realizó una estancia posdoctoral en Ciencia de Datos Biomédicos y Genética en la Universidad de Stanford. Ex-becario Fulbright, forma parte del Comité Editorial del Instituto de Ciencia, Tecnología e Innovación (ICTI) de Michoacán. Su trabajo de investigación se centra en las aplicaciones de la inteligencia artificial en la salud, incluyendo la genómica clínica, salud digital y sistemas que apoyen un mejor diagnóstico y tratamientos con equidad y ética. Como emprendedor, el Dr. López Pineda es director general (CEO) de Amphora Health, una empresa mexicana de tecnología en salud que desarrolla un ecosistema de salud digital, incluyendo un expediente clínico electrónico y un cerebro clínico digital."
  educationHeading: "Formación Académica"
  education:
