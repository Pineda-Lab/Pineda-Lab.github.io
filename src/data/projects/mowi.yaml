en:
  name: "MOWI"
  title: "Mobile and Wearable Interfaces for Health and Physical Activity Observation."
  abstract: "This digital health project integrates and standardizes observational data from mobile devices and wearables in adults to address physical activity data fragmentation. Using data science and statistical analysis, the study evaluates activity patterns to inform public health strategies aimed at preventing sedentary behavior, obesity, and cardiovascular diseases."
  logo: ""
  collaborators:
     - name: "Dr. Arturo López Pineda"
       role: "Principal Investigator"
       affiliation: "ENES Morelia, UNAM / Amphora Health"
       photo: "/images/people/arturo-headshot.png"
     - name: "Dra. Myriam Alanis Espinosa"
       role: "Co-Investigator"
       affiliation: "Tecnológico de Monterrey"
       photo: ""
  bioethics:
    reviewingCommittees: "Institutional Review Board from Tecnológico de Monterrey"
    protocolId: "P000811-MOWI-CS002"
  funding:
