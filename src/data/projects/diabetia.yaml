en:
  name: "DIABETIA"
  title: "Longitudinal study for the development of predictive models for chronic complications of type 2 diabetes mellitus"
  abstract: "DiabetIA is a digital health research initiative focused on developing machine learning predictive models to anticipate chronic complications in patients with Type 2 Diabetes Mellitus. The project combines advanced data science with clinical information governance to advance precision medicine in Mexico."
  logo: "/images/projects/diabetia-logo.png"
  collaborators:
    - name: "Dra. Anel Gómez García"
      role: "Principal Investigator"
      affiliation: "CIBIMI IMSS"
      photo: "/images/people/anel-gomez-garcia.jpg"
    - name: "Dr. Arturo López Pineda"
      role: "Co-Investigator"
      affiliation: "ENES Morelia, UNAM / Amphora Health"
      photo: "/images/people/arturo-headshot.png"
    - name: "Dr. Cleto Alvarez Aguilar"
      role: "Co-Investigator"
      affiliation: "Faculty of Medicine, UMSNH"
      photo: "/images/people/cleto-alvarez-aguilar.jpg"
    - name: "Dra. Karina M. Figueroa Mora"
      role: "Co-Investigator"
      affiliation: "FISMAT UMSNH"
      photo: "/images/people/karina-figueroa-mora.jpg"
    - name: "Dra. Marisol Flores Garrido"
      role: "Co-Investigator"
      affiliation: "ENES Morelia, UNAM"
      photo: "/images/people/marisol-flores-garrido.jpg"
    - name: "Dr. Luis Miguel García Velázquez"
      role: "Co-Investigator"
      affiliation: "ENES Morelia, UNAM"
      photo: "/images/people/luis-garcia-velazquez.jpg"
  bioethics:
    reviewingCommittees: "National Research Committee and National Research Ethics Committee (IMSS)"
    protocolId: "PI-2018-1671"
  funding:
    source: "CONACYT (FORDECyT / ProNacEs)"
    program: "Data Science and Health Call (Registry 10410)"
  subprojects:
    - title: "Flagship Project to Describe the Repository"
      status: "Active"
      resources:
        - name: "Beluga Science Repository"
          link: "https://belugascience.com/diabetia"
        - name: "ENI SECIHTI Repository"
          link: "https://repositorio-salud.conacyt.mx/jspui/handle/1000/56"
    - title: "Diabetes Complications Modeling"
      status: "Active"
      articles:
        - title: "DiabetIA: Building Machine Learning Models for Type 2 Diabetes Complications"
          venue: "medRxiv preprint, 2023"
          url: "https://www.medrxiv.org/content/10.1101/2023.10.22.23297277v1"
    - title: "Emulation of a Phase IV Clinical Trial Using Real-World Data"
      status: "Active"

es:
  name: "DIABETIA"
  title: "Estudio longitudinal para el desarrollo de modelos predictivos de complicaciones crónicas de la diabetes mellitus tipo 2"
  abstract: "DiabetIA es una iniciativa de investigación en salud digital enfocada en el desarrollo de modelos predictivos de aprendizaje automático para anticipar complicaciones crónicas en pacientes con Diabetes Mellitus Tipo 2. El proyecto combina ciencia de datos avanzada y gobernanza de información clínica para impulsar la medicina de precisión en México."
  logo: "/images/projects/diabetia-logo.png"
  collaborators:
    - name: "Dra. Anel Gómez García"
      role: "Investigadora Principal"
      affiliation: "CIBIMI IMSS"
      photo: "/images/people/anel-gomez-garcia.jpg"
