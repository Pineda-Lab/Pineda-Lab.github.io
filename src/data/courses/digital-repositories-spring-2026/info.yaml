en:
  name: "Digital Repositories"
  description: "This course offers a complete immersion into the world of Data Science, Information Systems, and Digital Repositories. It is designed to give students a deep understanding of the theoretical concepts and practical skills needed to navigate and lead in the field of information technology."
  classroomUrl: "https://classroom.google.com/c/NzkzNTgwODA0NzQ1?cjc=k3fetg4d"
  syllabus: "syllabus.pdf"
  logistics:
    schedule: "Mondays and Wednesdays, 8:00–10:00 AM"
    location: "Room A101"
  staff:
    - name: "Dr. Arturo López Pineda"
      role: "Instructor"
      email: "arturolp@enesmorelia.unam.mx"
      photo: "/images/people/arturo-headshot.png"
  topics:
    - title: "Real-World Data"
      subtopics:
        - "Introduction to Digital Repositories"
        - "Real-World Data"
        - "Interoperability and Metadata Standards"
        - "Repository Evaluation"
    - title: "Data Science"
      subtopics:
        - "Exploratory Data Analysis"
        - "Exploratory Data Analysis"
        - "Data Visualization"
        - "Machine Learning"
    - title: "Organizing Information"
      subtopics:
        - "Taxonomies and Hierarchies for Data Organization"
        - "Ontologies"
        - "Metadata Standards"
        - "Folksonomies and Tagging"
        - "Data Cataloging Processes"
        - "International Metadata Standards"
    - title: "Information Systems Architecture"
      subtopics:
        - "Fundamentals of Systems Architecture"
        - "Hardware and Software Components of an Information System"
        - "Systems Design and Modeling"
        - "Databases and Data Storage"
        - "Current and Future Trends in Systems Architecture"
        - "Systems Integration and Data Migration"
    - title: "Computing in Digital Repositories"
      subtopics:
        - "Introduction to Computing in Digital Repositories"
        - "Data Processing and Analysis in Repositories"
        - "Computational Methods for Large-Scale Data"
        - "Distributed Computing in Data Science"
        - "Tools and Frameworks for Computing in Repositories"
        - "Data Visualization and Reporting"
    - title: "Legal and Ethical Aspects"
      subtopics:
        - "Intellectual Property Protection in Data Science"
        - "Data Privacy and Security"
        - "Ethical Considerations in Data Handling"
    - title: "Funding Management and Strategies"
      subtopics:
        - "Fundamentals of Information Technology Funding"
        - "Cost Models for Information Systems and Digital Repositories"
        - "Crowdfunding and Collaborative Financing"
        - "Business Models and Revenue Generation for Digital Repositories"
  grading:
    - component: "Assignments"
      percentage: 20
      description: "Short exercises and case studies related to the course topics."
    - component: "Student Presentations"
      percentage: 20
      description: "Presentations on specific course topics."
    - component: "Quizzes"
      percentage: 15
      description: "Mid-course assessments."
    - component: "Final Exam"
      percentage: 20
      description: "Written evaluation at the end of the course covering all topics."
    - component: "Practical Project"
      percentage: 25
      description: "Projects involving the practical application of the course's concepts."
  policies:
    - "Attendance carries no direct percentage weight in the final grade. However, a minimum of 80% attendance is required to be eligible for continuous assessment and the final ordinary exam."
    - "All submitted work (assignments, presentations, and projects) must be original. Generative AI tools may be used only for research, brainstorming, or grammar review — not to draft the final content. The instructor reserves the right to request an in-person oral defense of any submitted work; if the student cannot demonstrate mastery of the topic or authorship of the text during that defense, the activity will be voided (a grade of zero)."
  readings:
    - label: "Downey, A. (2018). Elements of Data Science. O'Reilly Media, Inc."
      url: "https://allendowney.github.io/ElementsOfDataScience"
    - label: "Glushko, Robert J. (2013). The Discipline of Organizing (4th Professional ed.)."
      url: "https://berkeley.pressbooks.pub/tdo4p/"
    - label: "Dietrich, David, Barry Heller, and Beibei Yang. (2015). Data Science & Big Data Analytics: Discovering, Analyzing, Visualizing and Presenting Data. Wiley."
    - label: "Schneier, B. (2015). Data and Goliath: The Hidden Battles to Collect Your Data and Control Your World. WW Norton & Company."
    - label: "Davis, K. (2012). Ethics of Big Data: Balancing Risk and Innovation. O'Reilly Media, Inc."
    - label: "Jones, R. E., Andrew, T., & MacColl, J. (2006). The Institutional Repository. Elsevier."
      url: "https://www.sciencedirect.com/book/9781843341383/the-institutional-repository"
es:
  name: "Repositorios Digitales"
  description: "Este curso ofrece una inmersión completa en el mundo de la Ciencia de Datos, Sistemas de Información, y Repositorios Digitales. Está diseñado para proporcionar a los estudiantes un entendimiento profundo de los conceptos teóricos y habilidades prácticas necesarias para navegar y liderar en el campo de la tecnología de la información."
  classroomUrl: "https://classroom.google.com/c/NzkzNTgwODA0NzQ1?cjc=k3fetg4d"
  syllabus: "syllabus.pdf"
  logistics:
    schedule: "Lunes y Miércoles, 8:00–10:00 AM"
    location: "Salón A101"
  staff:
    - name: "Dr. Arturo López Pineda"
      role: "Profesor"
      email: "arturolp@enesmorelia.unam.mx"
      photo: "/images/people/arturo-headshot.png"
  topics:
    - title: "Datos del Mundo Real"
      subtopics:
        - "Introducción a los Repositorios Digitales"
        - "Datos del Mundo Real"
        - "Interoperabilidad y Estándares de Metadatos"
        - "Evaluación de repositorios"
    - title: "Ciencia de Datos"
      subtopics:
        - "Análisis exploratorio de datos"
        - "Análisis exploratorio de datos"
        - "Visualización de Datos"
        - "Machine Learning"
    - title: "Organización de la Información"
      subtopics:
        - "Taxonomías y Jerarquías para la Organización de Datos"
        - "Ontologías"
        - "Estándares de Metadatos"
        - "Folksonomías y Etiquetado"
        - "Procesos de Catalogación de Datos"
        - "Estándares Internacionales de Metadatos"
    - title: "Arquitectura de Sistemas de Información"
      subtopics:
        - "Fundamentos de la Arquitectura de Sistemas"
        - "Componentes de Hardware y Software de un Sistema de Información"
        - "Diseño y Modelado de Sistemas"
        - "Bases de Datos y Almacenamiento de Datos"
        - "Tendencias Actuales y Futuras en Arquitectura de Sistemas"
        - "Integración de Sistemas y Migración de Datos"
    - title: "Computación en Repositorios Digitales"
      subtopics:
        - "Introducción a la Computación en Repositorios Digitales"
        - "Procesamiento y Análisis de Datos en Repositorios"
        - "Métodos Computacionales para Datos a Gran Escala"
        - "Computación Distribuida en Ciencia de Datos"
        - "Herramientas y Marcos para la Computación en Repositorios"
        - "Visualización de Datos y Reportes"
    - title: "Aspectos Legales y Éticos"
      subtopics:
        - "Protección de la Propiedad Intelectual en Ciencia de Datos"
        - "Privacidad y Seguridad de Datos"
        - "Consideraciones Éticas en el Manejo de Datos"
    - title: "Gestión y Estrategias de Financiamiento"
      subtopics:
        - "Fundamentos de financiamiento en tecnología de la información"
        - "Modelos de costos para sistemas de información y repositorios digitales"
        - "Crowdfunding, financiamiento colectivo, y colaboraciones"
        - "Modelos de negocio y generación de ingresos para repositorios digitales"
  grading:
    - component: "Tareas"
      percentage: 20
      description: "Ejercicios cortos y estudios de caso relacionados con los temas del curso."
    - component: "Presentaciones de los Alumnos"
      percentage: 20
      description: "Presentaciones sobre temas específicos del curso."
    - component: "Exámenes rápidos"
      percentage: 15
      description: "Evaluaciones intermedias del curso."
    - component: "Examen Final"
      percentage: 20
      description: "Evaluación escrita al final del curso cubriendo todos los temas."
    - component: "Proyecto Práctico"
      percentage: 25
      description: "Proyectos que involucran la aplicación práctica de los conocimientos."
  policies:
    - "La asistencia no tiene un valor porcentual directo sobre la calificación final. Sin embargo, se requiere un mínimo del 80% de asistencia para tener derecho a la evaluación continua y al examen ordinario final."
    - "Todos los trabajos entregados (tareas, presentaciones y proyectos) deben ser de autoría propia. El uso de herramientas de Inteligencia Artificial está permitido únicamente para búsqueda de información, lluvia de ideas, revisión gramatical, pero no para la redacción final del contenido. El profesor se reserva el derecho de solicitar una réplica oral presencial de cualquier trabajo entregado. Si el alumno no logra demostrar el dominio del tema o la autoría del texto durante la réplica, la actividad será anulada (calificación de 0)."
  readings:
    - label: "Downey, A. (2018). Elements of Data Science. O'Reilly Media, Inc."
      url: "https://allendowney.github.io/ElementsOfDataScience"
    - label: "Glushko, Robert J. (2013). The Discipline of Organizing (4th Professional ed.)."
      url: "https://berkeley.pressbooks.pub/tdo4p/"
    - label: "Dietrich, David, Barry Heller, and Beibei Yang. (2015). Data Science & Big Data Analytics: Discovering, Analyzing, Visualizing and Presenting Data. Wiley."
    - label: "Schneier, B. (2015). Data and Goliath: The Hidden Battles to Collect Your Data and Control Your World. WW Norton & Company."
    - label: "Davis, K. (2012). Ethics of Big Data: Balancing Risk and Innovation. O'Reilly Media, Inc."
    - label: "Jones, R. E., Andrew, T., & MacColl, J. (2006). The Institutional Repository. Elsevier."
      url: "https://www.sciencedirect.com/book/9781843341383/the-institutional-repository"
