en:
  title: "Pineda Lab"
  subtitle: "Artificial Intelligence · Digital Health · Clinical Genomics"
  intro: "We are an academic group at the National School of Higher Studies, Morelia Campus (ENES Morelia), UNAM, led by Dr. Arturo López Pineda. Our work focuses on artificial intelligence in health, digital health tools, and clinical genomics, with the goal of improving diagnosis, treatment, and health equity."
  campusPhotoAlt: "ENES Morelia campus"
  ctaPrimary: "Meet the team"
  pillarsEyebrow: "Research Pillars"
  pillarsTitle: "What is the lab's focus?"
  pillars:
    - icon: "brain"
      title: "AI in Health"
      description: "Machine learning and AI systems that support clinical decision-making, diagnosis, and better health outcomes."
    - icon: "device"
      title: "Digital Health"
      description: "Digital tools that extend the reach of healthcare, with a focus on usability and impact in Latin America."
    - icon: "dna"
      title: "Clinical Genomics"
      description: "Computational methods to interpret genomic data and translate it into actionable insights for patient care and public health."

es:
  title: "Pineda Lab"
  subtitle: "Inteligencia Artificial · Salud Digital · Genómica Clínica"
  intro: "Somos un grupo académico de la Escuela Nacional de Estudios Superiores, Unidad Morelia (ENES Morelia), UNAM, dirigido por el Dr. Arturo López Pineda. Nuestro trabajo se enfoca en inteligencia artificial en salud, herramientas de salud digital y genómica clínica, con el objetivo de mejorar el diagnóstico, el tratamiento y la equidad en salud."
  campusPhotoAlt: "Campus de la ENES Morelia"
  ctaPrimary: "Conoce al equipo"
  pillarsEyebrow: "Líneas de Investigación"
  pillarsTitle: "¿Cuál es el foco del laboratoio?"
  pillars:
    - icon: "brain"
      title: "IA en Salud"
      description: "Sistemas de aprendizaje automático e inteligencia artificial que apoyan la toma de decisiones clínicas, el diagnóstico y mejores resultados en salud."
    - icon: "device"
      title: "Salud Digital"
      description: "Herramientas digitales que amplían el alcance de la atención médica, con enfoque en usabilidad e impacto en Latinoamérica."
    - icon: "dna"
      title: "Genómica Clínica"
      description: "Métodos computacionales para interpretar datos genómicos y traducirlos en información útil para la atención de pacientes y la salud pública."
